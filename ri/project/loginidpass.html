<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Authentication Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 300px;
            box-shadow: 0px 0px 10px gray;
        }
        h2 { text-align: center; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        #message { text-align: center; margin-top: 15px; font-weight: bold; }
        .toggle-text {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        .toggle-text span {
            color: blue;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 id="form-title">Login</h2>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <button id="submit-btn" onclick="handleSubmit()">Login</button>

    <p class="toggle-text" id="toggle-container">
        Don't have an account? <span onclick="toggleForm(true)">Sign Up</span>
    </p>
    
    <p id="message"></p>
</div>

<script>
let isSignUpMode = false;

function toggleForm(signUp) {
    isSignUpMode = signUp;
    const title = document.getElementById("form-title");
    const button = document.getElementById("submit-btn");
    const toggleContainer = document.getElementById("toggle-container");
    document.getElementById("message").innerHTML = "";

    if (signUp) {
        title.innerText = "Sign Up";
        button.innerText = "Register";
        toggleContainer.innerHTML = 'Already have an account? <span onclick="toggleForm(false)">Login</span>';
    } else {
        title.innerText = "Login";
        button.innerText = "Login";
        toggleContainer.innerHTML = 'Don\'t have an account? <span onclick="toggleForm(true)">Sign Up</span>';
    }
}

async function handleSubmit() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const messageEl = document.getElementById("message");

    if (!username || !password) {
        messageEl.style.color = "red";
        messageEl.innerHTML = "Please fill in all fields.";
        return;
    }

    // Determine target endpoint
    const endpoint = isSignUpMode ? '/register' : '/login';

    
}
</script>

</body>
</html>
