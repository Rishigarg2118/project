# HTTP - Redirect all traffic to HTTPS
server {
    listen 80;
    server_name localhost; # Replace with your actual domain name in production

    # Let's Encrypt / Certbot verification challenge location
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - SSL Server
server {
    listen 443 ssl;
    server_name localhost; # Replace with your actual domain name in production

    # SSL certificate paths (Mount certificate volume in docker-compose)
    ssl_certificate /etc/letsencrypt/live/localhost/fullchain.pem; # Replace localhost with production domain
    ssl_certificate_key /etc/letsencrypt/live/localhost/privkey.pem; # Replace localhost with production domain

    # Secure SSL Protocols and Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy backend API requests (Module 18)
    location /api {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy uploaded files (Module 13)
    location /uploads {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
